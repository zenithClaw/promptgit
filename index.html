<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PromptGit — Version Control for AI Prompts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #080810;
  --surface: #0e0e1a;
  --surface2: #13131f;
  --border: rgba(255,255,255,0.06);
  --border-hover: rgba(255,255,255,0.1);
  --text: #eeeef8;
  --text-2: #8888aa;
  --text-3: #44445a;
  --accent: #7c6af7;
  --accent-dim: rgba(124,106,247,0.12);
  --accent-glow: rgba(124,106,247,0.2);
  --green: #4ade80;
  --green-dim: rgba(74,222,128,0.1);
  --red: #f87171;
  --red-dim: rgba(248,113,113,0.1);
  --mono: 'JetBrains Mono', monospace;
}

html, body { height: 100%; }

body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── Header ── */
header {
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  height: 48px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
  background: rgba(8,8,16,0.9);
  backdrop-filter: blur(12px);
}

.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.logo-dot {
  width: 7px; height: 7px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 8px var(--accent-glow);
}

.header-badge {
  font-family: var(--mono);
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--accent-dim);
  color: var(--accent);
}

.header-tagline {
  font-size: 12px;
  color: var(--text-3);
  margin-left: auto;
}

.mode-toggle {
  display: flex;
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}

.mode-btn {
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 500;
  background: none;
  border: none;
  color: var(--text-3);
  cursor: pointer;
  transition: all 0.15s;
}

.mode-btn:first-child { border-right: 1px solid var(--border); }
.mode-btn:hover { color: var(--text-2); }
.mode-btn.active { background: var(--accent-dim); color: var(--accent); }

/* ── Main layout ── */
.workspace {
  display: grid;
  grid-template-columns: 1fr 300px;
  flex: 1;
  overflow: hidden;
}

/* ── Left: Editor ── */
.editor-panel {
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
  overflow: hidden;
}

.panel-head {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  background: var(--surface);
}

.panel-label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-3);
}

.active-hash {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--accent);
}

/* edit view */
.edit-view {
  display: flex;
  flex-direction: column;
  flex: 1;
  padding: 16px;
  gap: 10px;
  overflow: hidden;
}

textarea {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.7;
  padding: 14px 16px;
  resize: none;
  outline: none;
  transition: border-color 0.15s;
}

textarea:focus { border-color: rgba(124,106,247,0.4); }
textarea::placeholder { color: var(--text-3); }

.editor-footer {
  display: flex;
  align-items: center;
  gap: 8px;
}

.char-info {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-3);
  margin-right: auto;
}

.commit-input {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-size: 12px;
  padding: 7px 12px;
  outline: none;
  transition: border-color 0.15s;
  max-width: 260px;
}

.commit-input:focus { border-color: rgba(124,106,247,0.4); }
.commit-input::placeholder { color: var(--text-3); }

.btn {
  padding: 7px 14px;
  border-radius: 6px;
  border: 1px solid var(--border);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.btn-primary {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.btn-primary:hover { opacity: 0.88; }

.btn-ghost {
  background: none;
  color: var(--text-3);
}
.btn-ghost:hover { color: var(--text-2); border-color: var(--border-hover); }

.btn-danger {
  background: none;
  color: var(--red);
  border-color: transparent;
}
.btn-danger:hover { background: var(--red-dim); border-color: var(--red-dim); }

/* compare view */
.compare-view {
  display: none;
  flex: 1;
  overflow: hidden;
}
.compare-view.show {
  display: grid;
  grid-template-columns: 1fr 1fr;
}

.compare-side {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-right: 1px solid var(--border);
}
.compare-side:last-child { border-right: none; }

.compare-head {
  padding: 8px 14px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-3);
  flex-shrink: 0;
}

.compare-body {
  flex: 1;
  padding: 16px;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.7;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-word;
  color: var(--text-2);
}

/* diff strip */
.diff-strip {
  border-top: 1px solid var(--border);
  background: var(--surface);
  flex-shrink: 0;
  display: none;
}
.diff-strip.show { display: block; }

.diff-head {
  padding: 8px 14px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}

.diff-label {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--text-3);
}

.diff-close {
  margin-left: auto;
  background: none;
  border: none;
  color: var(--text-3);
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
  padding: 0 2px;
}
.diff-close:hover { color: var(--text-2); }

.diff-body {
  padding: 12px 16px;
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.7;
  max-height: 180px;
  overflow-y: auto;
  white-space: pre-wrap;
  word-break: break-word;
}

.diff-body::-webkit-scrollbar { width: 4px; }
.diff-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.ins { background: var(--green-dim); color: var(--green); border-radius: 2px; padding: 0 2px; }
.del { background: var(--red-dim); color: var(--red); border-radius: 2px; padding: 0 2px; text-decoration: line-through; }

/* ── Right: History ── */
.history-panel {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.history-list {
  flex: 1;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--border) transparent;
}

.history-list::-webkit-scrollbar { width: 4px; }
.history-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  height: 200px;
  color: var(--text-3);
  padding: 24px;
  text-align: center;
}

.empty-icon {
  width: 32px; height: 32px;
  border: 1px dashed var(--border-hover);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.empty-icon svg { opacity: 0.4; }
.empty-text { font-size: 12px; line-height: 1.6; }

.version-item {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.1s;
  position: relative;
}

.version-item:hover { background: rgba(255,255,255,0.02); }

.version-item.active {
  background: var(--accent-dim);
  border-left: 2px solid var(--accent);
  padding-left: 14px;
}

.version-item.comparing {
  background: var(--green-dim);
  border-left: 2px solid var(--green);
  padding-left: 14px;
}

.v-row1 {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 3px;
}

.v-hash {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  color: var(--accent);
}

.v-tag {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 3px;
  font-weight: 500;
}

.v-tag-current { background: var(--accent-dim); color: var(--accent); }
.v-tag-a { background: var(--green-dim); color: var(--green); }
.v-tag-b { background: rgba(251,191,36,0.1); color: #fbbf24; }

.v-msg {
  font-size: 12px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 2px;
}

.v-meta {
  font-size: 11px;
  color: var(--text-3);
  font-family: var(--mono);
}

.v-actions {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  display: none;
  gap: 4px;
}

.version-item:hover .v-actions { display: flex; }

.v-btn {
  font-size: 10px;
  padding: 3px 8px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--text-2);
  cursor: pointer;
  transition: all 0.15s;
}
.v-btn:hover { border-color: var(--border-hover); color: var(--text); }
.v-btn.danger { color: var(--red); }
.v-btn.danger:hover { background: var(--red-dim); border-color: var(--red-dim); }

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(60px);
  background: var(--surface2);
  border: 1px solid var(--border-hover);
  border-radius: 8px;
  padding: 10px 18px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-2);
  z-index: 100;
  opacity: 0;
  transition: all 0.25s;
  white-space: nowrap;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.toast.ok { border-color: rgba(74,222,128,0.3); color: var(--green); }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-dot"></span>
    PromptGit
  </div>
  <span class="header-badge" id="versionBadge">0 versions</span>
  <div class="mode-toggle">
    <button class="mode-btn active" onclick="setMode('edit')">Editor</button>
    <button class="mode-btn" onclick="setMode('compare')">Compare</button>
  </div>
  <span class="header-tagline">version control for AI prompts · all local</span>
</header>

<div class="workspace">

  <!-- Left -->
  <div class="editor-panel">
    <div class="panel-head">
      <span class="panel-label">Prompt Editor</span>
      <span class="active-hash" id="activeLabel">new</span>
    </div>

    <!-- Edit mode -->
    <div class="edit-view" id="editView">
      <textarea id="promptEditor"
        placeholder="Write your prompt here…&#10;&#10;Every save creates a new version you can diff, compare, and restore."
        spellcheck="false"></textarea>
      <div class="editor-footer">
        <span class="char-info"><span id="charCount">0</span> chars · <span id="wordCount">0</span> words</span>
        <button class="btn btn-ghost" onclick="clearEditor()">Clear</button>
        <input class="commit-input" id="commitMsg" placeholder="Commit message (optional)" />
        <button class="btn btn-primary" onclick="saveVersion()">Save version</button>
      </div>
    </div>

    <!-- Compare mode -->
    <div class="compare-view" id="compareView">
      <div class="compare-side">
        <div class="compare-head" id="compareHeadA">Select version A →</div>
        <div class="compare-body" id="compareBodyA" style="color:var(--text-3)">No version selected</div>
      </div>
      <div class="compare-side">
        <div class="compare-head" id="compareHeadB">Select version B →</div>
        <div class="compare-body" id="compareBodyB" style="color:var(--text-3)">No version selected</div>
      </div>
    </div>

    <!-- Diff strip -->
    <div class="diff-strip" id="diffStrip">
      <div class="diff-head">
        <span class="diff-label" id="diffLabel">Diff</span>
        <button class="diff-close" onclick="closeDiff()">×</button>
      </div>
      <div class="diff-body" id="diffBody"></div>
    </div>
  </div>

  <!-- Right -->
  <div class="history-panel">
    <div class="panel-head">
      <span class="panel-label">History</span>
      <button class="btn btn-danger" style="font-size:11px;padding:4px 10px" onclick="clearAll()">Clear all</button>
    </div>
    <div class="history-list" id="historyList">
      <div class="empty-state">
        <div class="empty-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/>
            <path d="M18 9v1a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9"/><line x1="12" y1="12" x2="12" y2="15"/>
          </svg>
        </div>
        <span class="empty-text">No versions yet.<br>Write a prompt and save it.</span>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
let versions = JSON.parse(localStorage.getItem('promptgit_v2') || '[]');
let mode = 'edit';
let activeIdx = null;
let compareA = null, compareB = null;

// ── Init ──────────────────────────────────────────────────────────────────────
document.getElementById('promptEditor').addEventListener('input', updateCounts);
render();
updateCounts();

// ── Core ──────────────────────────────────────────────────────────────────────
function saveVersion() {
  const content = document.getElementById('promptEditor').value.trim();
  if (!content) { toast('Nothing to save', ''); return; }
  const msg = document.getElementById('commitMsg').value.trim() || 'Updated prompt';
  const hash = Math.random().toString(36).substr(2, 7);
  versions.unshift({ hash, content, message: msg, ts: Date.now() });
  localStorage.setItem('promptgit_v2', JSON.stringify(versions));
  document.getElementById('commitMsg').value = '';
  activeIdx = 0;
  render();
  toast('Saved ' + hash, 'ok');
}

function selectVersion(i) {
  if (mode === 'compare') {
    if (compareA === null || (compareA !== null && compareB !== null)) {
      compareA = i; compareB = null;
    } else if (compareB === null && i !== compareA) {
      compareB = i;
      renderCompare();
    }
    render();
    return;
  }
  activeIdx = i;
  document.getElementById('promptEditor').value = versions[i].content;
  document.getElementById('activeLabel').textContent = versions[i].hash;
  updateCounts();
  render();
  if (versions[i - 1]) diffBetween(i, i - 1);
  else if (versions[i + 1]) diffBetween(i + 1, i);
}

function deleteVersion(i) {
  versions.splice(i, 1);
  localStorage.setItem('promptgit_v2', JSON.stringify(versions));
  if (activeIdx === i) clearEditor();
  else if (activeIdx > i) activeIdx--;
  render();
  toast('Version deleted', '');
}

function clearAll() {
  if (!versions.length) return;
  if (!confirm('Delete all versions? Cannot be undone.')) return;
  versions = [];
  localStorage.removeItem('promptgit_v2');
  clearEditor();
  render();
  toast('Cleared', '');
}

function clearEditor() {
  document.getElementById('promptEditor').value = '';
  document.getElementById('activeLabel').textContent = 'new';
  activeIdx = null;
  updateCounts();
  closeDiff();
  render();
}

// ── Mode ──────────────────────────────────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.querySelectorAll('.mode-btn').forEach((b, i) =>
    b.classList.toggle('active', (m === 'edit' && i === 0) || (m === 'compare' && i === 1))
  );
  document.getElementById('editView').style.display = m === 'edit' ? 'flex' : 'none';
  document.getElementById('compareView').classList.toggle('show', m === 'compare');
  if (m === 'compare') {
    compareA = null; compareB = null;
    render();
    toast('Select 2 versions to compare', '');
  }
}

// ── Diff ──────────────────────────────────────────────────────────────────────
function diffBetween(newerIdx, olderIdx) {
  const curr = versions[newerIdx].content;
  const prev = versions[olderIdx].content;
  document.getElementById('diffBody').innerHTML = computeDiff(prev, curr);
  document.getElementById('diffLabel').textContent =
    `${versions[olderIdx].hash} → ${versions[newerIdx].hash}`;
  document.getElementById('diffStrip').classList.add('show');
}

function closeDiff() {
  document.getElementById('diffStrip').classList.remove('show');
}

function computeDiff(oldText, newText) {
  const ow = oldText.split(/(\s+)/), nw = newText.split(/(\s+)/);
  const m = ow.length, n = nw.length;
  const dp = Array.from({ length: m + 1 }, () => new Array(n + 1).fill(0));
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = ow[i-1] === nw[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
  const res = [];
  let i = m, j = n;
  while (i > 0 || j > 0) {
    if (i > 0 && j > 0 && ow[i-1] === nw[j-1]) { res.unshift({t:'s',v:ow[i-1]}); i--; j--; }
    else if (j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) { res.unshift({t:'a',v:nw[j-1]}); j--; }
    else { res.unshift({t:'d',v:ow[i-1]}); i--; }
  }
  return res.map(r =>
    r.t === 's' ? esc(r.v) :
    r.t === 'a' ? `<span class="ins">${esc(r.v)}</span>` :
    `<span class="del">${esc(r.v)}</span>`
  ).join('');
}

// ── Compare ───────────────────────────────────────────────────────────────────
function renderCompare() {
  if (compareA === null || compareB === null) return;
  const vA = versions[compareA], vB = versions[compareB];
  document.getElementById('compareHeadA').textContent = `${vA.hash} — ${vA.message}`;
  document.getElementById('compareHeadB').textContent = `${vB.hash} — ${vB.message}`;
  document.getElementById('compareBodyA').textContent = vA.content;
  document.getElementById('compareBodyA').style.color = 'var(--text)';
  document.getElementById('compareBodyB').textContent = vB.content;
  document.getElementById('compareBodyB').style.color = 'var(--text)';
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const list = document.getElementById('historyList');
  document.getElementById('versionBadge').textContent =
    `${versions.length} version${versions.length !== 1 ? 's' : ''}`;

  if (!versions.length) {
    list.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/>
            <path d="M18 9v1a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9"/><line x1="12" y1="12" x2="12" y2="15"/>
          </svg>
        </div>
        <span class="empty-text">No versions yet.<br>Write a prompt and save it.</span>
      </div>`;
    return;
  }

  list.innerHTML = versions.map((v, i) => {
    const cls = activeIdx === i ? 'active' : (compareA === i || compareB === i ? 'comparing' : '');
    const tags = [
      activeIdx === i ? '<span class="v-tag v-tag-current">current</span>' : '',
      compareA === i ? '<span class="v-tag v-tag-a">A</span>' : '',
      compareB === i ? '<span class="v-tag v-tag-b">B</span>' : ''
    ].join('');
    return `
      <div class="version-item ${cls}" onclick="selectVersion(${i})">
        <div class="v-row1">
          <span class="v-hash">${v.hash}</span>${tags}
        </div>
        <div class="v-msg">${esc(v.message)}</div>
        <div class="v-meta">${relTime(v.ts)} · ${v.content.length} chars</div>
        <div class="v-actions">
          <button class="v-btn" onclick="event.stopPropagation();diffWith(${i})">Diff</button>
          <button class="v-btn danger" onclick="event.stopPropagation();deleteVersion(${i})">Delete</button>
        </div>
      </div>`;
  }).join('');
}

function diffWith(i) {
  if (!versions[i + 1]) { toast('No older version to diff against', ''); return; }
  diffBetween(i, i + 1);
}

// ── Utils ─────────────────────────────────────────────────────────────────────
function updateCounts() {
  const t = document.getElementById('promptEditor').value;
  document.getElementById('charCount').textContent = t.length;
  document.getElementById('wordCount').textContent = t.trim() ? t.trim().split(/\s+/).length : 0;
}

function relTime(ts) {
  const d = (Date.now() - ts) / 1000;
  if (d < 60) return 'just now';
  if (d < 3600) return Math.floor(d / 60) + 'm ago';
  if (d < 86400) return Math.floor(d / 3600) + 'h ago';
  return new Date(ts).toLocaleDateString();
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function toast(msg, type) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast' + (type === 'ok' ? ' ok' : '') + ' show';
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2500);
}
</script>
